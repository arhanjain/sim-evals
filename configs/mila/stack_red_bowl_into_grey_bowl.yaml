schema_version: 1
institution: MILA
task_id: stack_red_bowl_into_grey_bowl
scene_asset: Task1/Scene.usd
language_instruction: Pick up the red bowl and place it in the grey bowl.
success_criteria: The red bowl ends up inside the grey bowl and the gripper releases it.
max_timesteps: 600
seed: 42
success_hold_steps: 5
randomization_scope: movable_task_objects_only

milestones:
  - name: reached_red_bowl
    description: Gripper made contact with the red bowl.
  - name: lifted_up_red_bowl
    description: Red bowl was lifted clearly off the countertop.
  - name: above_grey_bowl
    description: Red bowl was lifted above and aligned with the grey bowl.
  - name: placed_in_grey_bowl
    description: Red bowl is contained inside the grey bowl and the gripper releases it.
final_milestone: placed_in_grey_bowl

